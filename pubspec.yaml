name: antigravity
description: "A cross-platform personal finance application with AI assistance"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  
  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Secure Storage
  flutter_secure_storage: ^9.0.0
  
  # HTTP Client for AI API
  dio: ^5.4.0
  
  # Charts
  fl_chart: ^0.66.0
  
  # Date formatting
  intl: ^0.19.0
  
  # Icons
  cupertino_icons: ^1.0.2
  lucide_icons_flutter: ^1.0.0
  
  # Authentication
  google_sign_in: ^6.1.6
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  
  # Navigation
  go_router: ^13.0.1
  
  # UI Components
  shimmer: ^3.0.0
  flutter_animate: ^4.3.0
  
  # Utils
  equatable: ^2.0.5
  dartz: ^0.10.1
  get_it: ^7.6.4
  logger: ^2.0.2
  uuid: ^4.2.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
